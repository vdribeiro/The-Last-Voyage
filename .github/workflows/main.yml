name: Build Compose Multiplatform App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  JAVA_VERSION: '21'

jobs:
  build-linux:
    name: Build Linux (.deb)
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 21 and Gradle Cache
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Create local.properties
        run: |
          echo "sentryDsn=${{ secrets.SENTRY_DSN }}" > local.properties

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg-dev

      - name: Build Linux .deb package
        run: ./gradlew packageDeb

      - name: Upload .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: The-Last-Voyage-deb
          path: composeApp/build/compose/binaries/main/deb/*.deb

      - name: Stop Gradle Daemon
        if: ${{ always() }}
        run: ./gradlew --stop

  build-windows:
    name: Build Windows (.msi)
    runs-on: windows-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 21 and Gradle Cache
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Create local.properties
        run: |
          echo "sentryDsn=${{ secrets.SENTRY_DSN }}" > local.properties

      - name: Build Windows .msi package
        run: ./gradlew.bat packageMsi

      - name: Upload .msi Artifact
        uses: actions/upload-artifact@v4
        with:
          name: The-Last-Voyage-msi
          path: composeApp/build/compose/binaries/main/msi/*.msi

      - name: Stop Gradle Daemon
        if: ${{ always() }}
        run: ./gradlew.bat --stop

